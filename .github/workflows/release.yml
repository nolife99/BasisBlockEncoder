name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  native:
    name: native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            lib: basis_block_encoder.dll
            platform: x64
          - os: windows-latest
            rid: win-x86
            lib: basis_block_encoder.dll
            platform: Win32
          - os: ubuntu-latest
            rid: linux-x64
            lib: libbasis_block_encoder.so
          - os: ubuntu-latest
            rid: linux-arm
            lib: libbasis_block_encoder.so
            apt: g++-arm-linux-gnueabihf
            toolchain: toolchain-linux-arm.cmake
          - os: ubuntu-latest
            rid: linux-arm64
            lib: libbasis_block_encoder.so
            apt: g++-aarch64-linux-gnu
            toolchain: toolchain-linux-arm64.cmake
          - os: macos-13
            rid: osx-x64
            lib: libbasis_block_encoder.dylib
          - os: macos-14
            rid: osx-arm64
            lib: libbasis_block_encoder.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        shell: bash
        run: |
          args=(-S native -B native/build -DCMAKE_BUILD_TYPE=Release)
          [ -n "${{ matrix.platform }}" ] && args+=(-A "${{ matrix.platform }}")
          [ -n "${{ matrix.toolchain }}" ] && args+=(-DCMAKE_TOOLCHAIN_FILE="$PWD/native/cmake/${{ matrix.toolchain }}")
          echo "cmake ${args[*]}"
          cmake "${args[@]}"

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Collect library
        shell: bash
        run: |
          mkdir -p out
          found="$(find native/build -name '${{ matrix.lib }}' -type f | head -1)"
          if [ -z "$found" ]; then echo "::error::built library not found"; find native/build -type f; exit 1; fi
          cp "$found" "out/${{ matrix.lib }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib }}
          if-no-files-found: error

  pack:
    name: pack & push
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts

      - name: Stage natives into runtimes/
        shell: bash
        run: |
          for d in artifacts/native-*; do
            rid="${d#artifacts/native-}"
            mkdir -p "runtimes/$rid/native"
            cp "$d"/* "runtimes/$rid/native/"
          done
          find runtimes -type f

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/BasisBlockEncoder/BasisBlockEncoder.csproj
          -c Release
          -o nupkg
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*
