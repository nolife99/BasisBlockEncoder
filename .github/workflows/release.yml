name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.3.0 (leave blank when run from a v* tag)'
        required: false
permissions:
  contents: read
jobs:
  pack:
    name: pack & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version: run from a v* tag or pass the 'version' input."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing BasisBlockEncoder $v"
      - name: Pack
        run: >
          dotnet pack BasisBlockEncoder/BasisBlockEncoder.csproj
          -c Release
          -o nupkg
          -p:Version=${{ steps.ver.outputs.version }}
          -p:ContinuousIntegrationBuild=true
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error