name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch test artworks (optional)
        if: ${{ vars.ARTWORKS_URL != '' }}
        run: |
          set -euo pipefail
          curl -fsSL -o artworks.tar "${{ vars.ARTWORKS_URL }}"
          echo "${{ vars.ARTWORKS_SHA256 }}  artworks.tar" | sha256sum -c -
          mkdir -p artworks
          tar -xaf artworks.tar -C artworks
          echo "Artworks present:"; ls -1 artworks

      - name: Build solution
        run: dotnet build Bcn.sln -c Release

      - name: Unit tests — LDR codecs + SIMD tier identity
        run: dotnet run --project Bcn.Ldr.Tests -c Release

      - name: Unit tests — BC7 eigenvalue bound
        run: dotnet run --project Bcn.Ldr.Tests -c Release -- eig

      - name: Unit tests — BC7 mode-6 prune invariance
        run: dotnet run --project Bcn.Ldr.Tests -c Release -- prune

      - name: Unit tests — BC6H oracle + image round-trip
        run: |
          set -euo pipefail
          # The unit project has no native dependency; stage the reference library from the bundled native
          # package so the managed-vs-native BC6H oracle can run here. If it isn't found, the oracle skips
          # (the authoritative managed-vs-native BC6H parity also runs in the "Quality parity vs native" job).
          rid=$([ "${{ matrix.arch }}" = "arm64" ] && echo linux-arm64 || echo linux-x64)
          unzip -oq localpackages/BasisBlockEncoder.*.nupkg "runtimes/$rid/native/*" -d "$RUNNER_TEMP/natlib" || true
          so="$RUNNER_TEMP/natlib/runtimes/$rid/native/libbasis_block_encoder.so"
          if [ -f "$so" ]; then export BBE_NATIVE_LIB="$so"; echo "BC6H oracle using native lib: $so"; fi
          dotnet run --project Bcn.Ldr.Tests -c Release -- bc6h
          dotnet run --project Bcn.Ldr.Tests -c Release -- bc6himg | tee bc6himg.log
          if grep -qE "[1-9][0-9]*[[:space:]]+mismatched bytes" bc6himg.log; then
            echo "::error::BC6H image round-trip reported byte mismatches"; exit 1
          fi

      - name: Quality parity vs native
        run: dotnet run --project Bcn.Bench -c Release -- verify

      - name: Write golden digest
        run: dotnet run --project Bcn.Bench -c Release -- golden-write "golden-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.arch }}
          path: golden-${{ matrix.arch }}.txt
          if-no-files-found: error

  cross-platform-identity:
    name: cross-platform byte identity
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: goldens
      - name: Assert x64 and arm64 output is byte-identical
        run: |
          set -euo pipefail
          x="$(find goldens -name 'golden-x64.txt' | head -1)"
          a="$(find goldens -name 'golden-arm64.txt' | head -1)"
          echo "x64:   $x"
          echo "arm64: $a"
          # Compare everything except the header comment line.
          if diff <(grep -v '^#' "$x") <(grep -v '^#' "$a"); then
            echo "PASS: managed encoder output is byte-identical on x64 and arm64."
          else
            echo "::error::managed encoder output differs across architectures (see diff above)"; exit 1
          fi