name: ci

# Correctness + cross-platform byte-identity gate. Runs x64 and arm64 in parallel (matrix, fail-fast off),
# then a final job asserts the managed encoder produced byte-identical output on both architectures.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore reads the repo nuget.config: nuget.org + the bundled ./localpackages feed (which carries the
      # native BasisBlockEncoder reference package, so this works even if that package is not on nuget.org).
      - name: Build managed engine
        run: dotnet build Bcn/Bcn.csproj -c Release

      # Pure-managed correctness: LDR round-trips + the scalar==V128==V256 SIMD-tier identity checks.
      - name: Correctness suite (managed)
        run: dotnet run --project Bcn.Ldr.Tests -c Release

      # Managed vs native PSNR parity (native ships arm64, so this runs on both architectures).
      # Returns non-zero if any comparable format trails native by > 0.75 dB.
      - name: Quality parity vs native
        run: dotnet run --project Bcn.Bench -c Release -- verify

      # Per-architecture byte-identity digests for the managed encoder (gate-safe corpus, all formats).
      - name: Write golden digests
        run: dotnet run --project Bcn.Bench -c Release -- golden-write golden-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.arch }}
          path: golden-${{ matrix.arch }}.txt

  cross-platform-identity:
    name: cross-platform byte identity
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: goldens
      - name: Assert x64 and arm64 are byte-identical
        run: |
          x="$(find goldens -name 'golden-x64.txt' | head -1)"
          a="$(find goldens -name 'golden-arm64.txt' | head -1)"
          echo "x64:   $x"
          echo "arm64: $a"
          # Compare everything except the header comment line (case count etc. are identical anyway).
          if diff <(grep -v '^#' "$x") <(grep -v '^#' "$a"); then
            echo "PASS: managed encoder output is byte-identical on x64 and arm64."
          else
            echo "FAIL: managed encoder output differs across architectures (see diff above)."
            exit 1
          fi
