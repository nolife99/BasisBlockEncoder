name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  native:
    name: native (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 / x64 Windows (32-bit + 64-bit)
          - os: windows-latest
            rid: win-x64
            lib: basis_block_encoder.dll
            platform: x64
          - os: windows-latest
            rid: win-x86
            lib: basis_block_encoder.dll
            platform: Win32
          - os: windows-11-arm
            rid: win-arm64
            lib: basis_block_encoder.dll
            platform: ARM64
          # x64 Linux
          - os: ubuntu-latest
            rid: linux-x64
            lib: libbasis_block_encoder.so
          # 32-bit ARM Linux (ARMv7), cross-compiled
          - os: ubuntu-latest
            rid: linux-arm
            lib: libbasis_block_encoder.so
            apt: g++-arm-linux-gnueabihf
            toolchain: toolchain-linux-arm.cmake
          # 64-bit ARM Linux (AArch64), cross-compiled
          - os: ubuntu-latest
            rid: linux-arm64
            lib: libbasis_block_encoder.so
            apt: g++-aarch64-linux-gnu
            toolchain: toolchain-linux-arm64.cmake
          # macOS (Intel + Apple Silicon)
          - os: macos-14
            rid: osx-x64
            lib: libbasis_block_encoder.dylib
            osx_arch: x86_64
          - os: macos-14
            rid: osx-arm64
            lib: libbasis_block_encoder.dylib
            osx_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        shell: bash
        run: |
          args=(-S native -B native/build -DCMAKE_BUILD_TYPE=Release)
          [ -n "${{ matrix.platform }}" ] && args+=(-A "${{ matrix.platform }}")
          [ -n "${{ matrix.toolchain }}" ] && args+=(-DCMAKE_TOOLCHAIN_FILE="$PWD/native/cmake/${{ matrix.toolchain }}")
          [ -n "${{ matrix.osx_arch }}" ] && args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          echo "cmake ${args[*]}"
          cmake "${args[@]}"

      - name: Build
        run: cmake --build native/build --config Release --parallel

      - name: Collect library
        shell: bash
        run: |
          mkdir -p out
          found="$(find native/build -name '${{ matrix.lib }}' -type f | head -1)"
          if [ -z "$found" ]; then echo "::error::built library not found"; find native/build -type f; exit 1; fi
          echo "found: $found"
          cp "$found" "out/${{ matrix.lib }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib }}
          if-no-files-found: error

  dotnet:
    name: build & test
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts

      - name: Stage natives into runtimes/
        shell: bash
        run: |
          for d in artifacts/native-*; do
            rid="${d#artifacts/native-}"
            mkdir -p "runtimes/$rid/native"
            cp "$d"/* "runtimes/$rid/native/"
          done
          find runtimes -type f

      - name: Build
        run: dotnet build src/BasisBlockEncoder/BasisBlockEncoder.csproj -c Release

      - name: Test
        run: LD_LIBRARY_PATH="$PWD/runtimes/linux-x64/native" dotnet test tests/BasisBlockEncoder.Tests/BasisBlockEncoder.Tests.csproj -c Release
