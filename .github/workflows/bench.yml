name: bench

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'BenchmarkDotNet job (dry / short / medium / default)'
        default: 'short'
        required: false

jobs:
  benchmark:
    name: bench ${{ matrix.format }} (${{ matrix.arch.name }})
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        format: [Bc1, Bc2, Bc3, Bc4, Bc5, Bc6h, Bc7]
        arch:
          - { name: x64,   runs-on: ubuntu-24.04 }
          - { name: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Optional real-asset corpus. Set repository variables ARTWORKS_URL and ARTWORKS_SHA256 to a fixed,
      # checksummed tar archive (images at the archive root). Unset -> the suite uses procedural textures.
      - name: Fetch test artworks (optional)
        if: ${{ vars.ARTWORKS_URL != '' }}
        run: |
          set -euo pipefail
          curl -fsSL -o artworks.tar "${{ vars.ARTWORKS_URL }}"
          echo "${{ vars.ARTWORKS_SHA256 }}  artworks.tar" | sha256sum -c -
          mkdir -p artworks
          tar -xaf artworks.tar -C artworks
          echo "Artworks present:"; ls -1 artworks

      - name: Run BenchmarkDotNet
        run: >
          dotnet run --project Bcn.Bench -c Release --
          bench
          --filter "*${{ matrix.format }}*"
          --job "${{ github.event.inputs.job || 'short' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.format }}-${{ matrix.arch.name }}
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn

  collect:
    name: collect markdown report
    needs: benchmark
    if: ${{ !cancelled() }}            # still assemble whatever succeeded if a leg failed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JOB_LEN: ${{ github.event.inputs.job || 'short' }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts        # -> artifacts/benchmark-results-<format>-<arch>/...

      - name: Assemble benchmarks.md
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=benchmarks.md
          {
            echo "# Benchmark results"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Job length: \`${JOB_LEN}\`"
            echo "- Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
          } > "$out"

          found=0
          for dir in artifacts/benchmark-results-*/; do
            base=$(basename "$dir")
            rest=${base#benchmark-results-}
            fmt=${rest%-*}            # formats carry no '-' (Bc1..Bc7, Bc6h)
            arch=${rest##*-}          # arches carry no '-' (x64, arm64)
            while IFS= read -r -d '' md; do
              found=1
              {
                echo "<details open><summary><strong>${fmt}</strong> — ${arch}</summary>"
                echo
                cat "$md"
                echo
                echo "</details>"
                echo
              } >> "$out"
            done < <(find "$dir" -type f -name '*-report-github.md' -print0 | sort -z)
          done

          if [ "$found" -eq 0 ]; then
            echo "_No \`*-report-github.md\` files were found in the downloaded artifacts._" >> "$out"
          fi

          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined markdown
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-markdown
          path: benchmarks.md
          if-no-files-found: error