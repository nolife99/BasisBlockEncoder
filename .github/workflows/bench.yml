name: bench

# BenchmarkDotNet timing suite (managed vs native, every format, whole images at native resolution).
# Manual trigger only — full benchmark runs are slow and scale with the size/count of committed artworks.
# Both architectures run in parallel.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet --filter glob (e.g. *Bc7* or *)'
        default: '*'
        required: false
      job:
        description: 'BenchmarkDotNet job (short / medium / default / dry)'
        default: 'short'
        required: false

jobs:
  benchmark:
    name: benchmark (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run BenchmarkDotNet
        run: >
          dotnet run --project Bcn.Bench -c Release --
          bench --filter ${{ github.event.inputs.filter }} --job ${{ github.event.inputs.job }}

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.arch }}
          path: BenchmarkDotNet.Artifacts/results/**
          if-no-files-found: warn
